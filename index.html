<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coverage Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<div class="topbar"><div class="brand">Coverage</div><div class="search"><input id="location" type="search" placeholder="Search location..." autocomplete="off"><button id="searchButton">Search</button></div></div>
<div class="panel"><h2>Coverage</h2>
<label class="layer"><input id="lteToggle" type="checkbox" checked><span class="swatch lte"></span><span>4G LTE</span></label>
<label class="layer"><input id="fivegToggle" type="checkbox" checked><span class="swatch fiveg"></span><span>5G</span></label>
<label class="layer"><input id="uwToggle" type="checkbox" checked><span class="swatch uw"></span><span>5G Ultra Wideband</span></label>
<div class="status">Coverage layers are ready for authorized GIS sources.</div></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
